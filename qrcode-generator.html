<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>二维码生成器</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .qrcode-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            font-family: Arial, sans-serif;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        .input-section {
            margin-bottom: 20px;
        }
        .input-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input, select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }
        textarea {
            resize: vertical;
            min-height: 100px;
        }
        .options-section {
            margin-bottom: 20px;
        }
        .options-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }
        .option-item {
            display: flex;
            flex-direction: column;
        }
        .color-inputs {
            display: flex;
            gap: 10px;
        }
        .color-input {
            flex: 1;
        }
        .qrcode-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 20px;
        }
        #qrcode {
            margin: 20px 0;
        }
        .buttons-section {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
        }
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            background-color: #4CAF50;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
        .scan-section {
            margin-top: 30px;
            text-align: center;
        }
        #scan-preview {
            margin-top: 10px;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            background-color: #f9f9f9;
        }
    </style>
</head>
<body>
    <div class="qrcode-container">
        <h1>二维码生成器</h1>
        
        <div class="input-section">
            <div class="input-group">
                <label for="content-type">内容类型</label>
                <select id="content-type">
                    <option value="text">文本</option>
                    <option value="url">网址</option>
                    <option value="phone">电话号码</option>
                    <option value="email">邮箱</option>
                </select>
            </div>
            <div class="input-group">
                <label for="content">输入内容</label>
                <textarea id="content" placeholder="请输入要生成二维码的内容"></textarea>
            </div>
        </div>
        
        <div class="options-section">
            <h3>二维码选项</h3>
            <div class="options-grid">
                <div class="option-item">
                    <label for="size">大小 (像素)</label>
                    <input type="number" id="size" min="100" max="500" value="200">
                </div>
                <div class="option-item">
                    <label>颜色</label>
                    <div class="color-inputs">
                        <div class="color-input">
                            <label for="foreground">前景色</label>
                            <input type="color" id="foreground" value="#000000">
                        </div>
                        <div class="color-input">
                            <label for="background">背景色</label>
                            <input type="color" id="background" value="#ffffff">
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="qrcode-section">
            <h3>生成的二维码</h3>
            <div id="qrcode"></div>
        </div>
        
        <div class="buttons-section">
            <button id="generate-btn">生成二维码</button>
            <button id="download-btn">下载PNG</button>
            <button id="scan-btn">扫描预览</button>
        </div>
        
        <div class="scan-section">
            <h3>扫描结果</h3>
            <div id="scan-preview">点击"扫描预览"按钮查看内容</div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <script src="qrcode-generator.js"></script>
</body>
</html>
