<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>长度单位换算器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f7fa;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .converter-container {
            background-color: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 123, 255, 0.15);
            width: 100%;
            max-width: 500px;
        }

        h1 {
            color: #165DFF;
            text-align: center;
            margin-bottom: 30px;
            font-size: 28px;
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 24px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }

        input[type="number"],
        select {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e0e7ff;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s ease;
            background-color: #fafbfc;
        }

        input[type="number"]:focus,
        select:focus {
            outline: none;
            border-color: #165DFF;
            background-color: white;
            box-shadow: 0 0 0 3px rgba(22, 93, 255, 0.1);
        }

        .swap-btn {
            display: flex;
            justify-content: center;
            margin: 20px 0;
        }

        .swap-btn button {
            background-color: #165DFF;
            color: white;
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 20px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .swap-btn button:hover {
            background-color: #0e4bdb;
            transform: rotate(180deg);
        }

        .action-buttons {
            display: flex;
            gap: 12px;
            margin-top: 10px;
        }

        .clear-btn {
            flex: 1;
            padding: 14px;
            background-color: #f5f7fa;
            color: #666;
            border: 2px solid #e0e7ff;
            border-radius: 10px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .clear-btn:hover {
            background-color: #ffebee;
            border-color: #ef5350;
            color: #e53935;
        }

        .result-container {
            margin-top: 30px;
            padding: 24px;
            background: linear-gradient(135deg, #165DFF 0%, #36bffa 100%);
            border-radius: 12px;
            text-align: center;
        }

        .result-label {
            color: rgba(255, 255, 255, 0.85);
            font-size: 14px;
            margin-bottom: 8px;
        }

        .result-value {
            color: white;
            font-size: 36px;
            font-weight: 700;
            word-break: break-all;
        }

        .result-unit {
            color: rgba(255, 255, 255, 0.9);
            font-size: 18px;
            margin-left: 8px;
        }

        .formula {
            margin-top: 16px;
            padding: 12px;
            background-color: rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            color: white;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="converter-container">
        <h1>📏 长度单位换算器</h1>
        
        <div class="form-group">
            <label>输入数值</label>
            <input type="number" id="inputValue" placeholder="请输入数值" value="1" step="any">
        </div>

        <div class="form-group">
            <label>输入单位</label>
            <select id="inputUnit">
                <option value="meter">米 (m)</option>
                <option value="centimeter">厘米 (cm)</option>
                <option value="millimeter">毫米 (mm)</option>
                <option value="inch">英寸 (in)</option>
            </select>
        </div>

        <div class="swap-btn">
            <button onclick="swapUnits()">⇅</button>
        </div>

        <div class="form-group">
            <label>输出单位</label>
            <select id="outputUnit">
                <option value="meter">米 (m)</option>
                <option value="centimeter" selected>厘米 (cm)</option>
                <option value="millimeter">毫米 (mm)</option>
                <option value="inch">英寸 (in)</option>
            </select>
        </div>

        <div class="action-buttons">
            <button class="clear-btn" onclick="clearAll()">🗑️ 清空</button>
        </div>

        <div class="result-container">
            <div class="result-label">换算结果</div>
            <div>
                <span class="result-value" id="resultValue">100</span>
                <span class="result-unit" id="resultUnit">cm</span>
            </div>
            <div class="formula" id="formula">1 米 = 100 厘米</div>
        </div>
    </div>

    <script>
        const unitToMillimeter = {
            meter: 1000,
            centimeter: 10,
            millimeter: 1,
            inch: 25.4
        };

        const unitNames = {
            meter: '米',
            centimeter: '厘米',
            millimeter: '毫米',
            inch: '英寸'
        };

        const unitSymbols = {
            meter: 'm',
            centimeter: 'cm',
            millimeter: 'mm',
            inch: 'in'
        };

        const inputValue = document.getElementById('inputValue');
        const inputUnit = document.getElementById('inputUnit');
        const outputUnit = document.getElementById('outputUnit');
        const resultValue = document.getElementById('resultValue');
        const resultUnit = document.getElementById('resultUnit');
        const formula = document.getElementById('formula');

        function convert() {
            const value = parseFloat(inputValue.value) || 0;
            const fromUnit = inputUnit.value;
            const toUnit = outputUnit.value;
            
            const valueInMm = value * unitToMillimeter[fromUnit];
            const result = valueInMm / unitToMillimeter[toUnit];
            
            resultValue.textContent = formatNumber(result);
            resultUnit.textContent = unitSymbols[toUnit];
            formula.textContent = `1 ${unitNames[fromUnit]} = ${formatNumber(unitToMillimeter[fromUnit] / unitToMillimeter[toUnit])} ${unitNames[toUnit]}`;
        }

        function formatNumber(num) {
            if (Math.abs(num) < 0.000001 || Math.abs(num) >= 1000000) {
                return num.toExponential(6);
            }
            const rounded = Math.round(num * 10000000000) / 10000000000;
            return rounded.toString();
        }

        function swapUnits() {
            const temp = inputUnit.value;
            inputUnit.value = outputUnit.value;
            outputUnit.value = temp;
            convert();
        }

        function clearAll() {
            inputValue.value = '';
            convert();
        }

        inputValue.addEventListener('input', convert);
        inputUnit.addEventListener('change', convert);
        outputUnit.addEventListener('change', convert);
        
        convert();
    </script>
</body>
</html>
