<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>员工考勤统计工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f7fa;
            color: #333;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        header {
            background-color: #1890ff;
            color: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
        }
        
        h1 {
            font-size: 24px;
            margin-bottom: 10px;
        }
        
        .upload-section {
            background-color: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        
        .upload-area {
            border: 2px dashed #d9d9d9;
            border-radius: 8px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .upload-area:hover {
            border-color: #1890ff;
            background-color: #f0f7ff;
        }
        
        .upload-area input[type="file"] {
            display: none;
        }
        
        .upload-text {
            font-size: 16px;
            color: #666;
        }
        
        .rules-section {
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        
        .rules-section h2 {
            font-size: 18px;
            margin-bottom: 15px;
            color: #1890ff;
        }
        
        .rule-item {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }
        
        .rule-item label {
            flex: 1;
            font-size: 14px;
        }
        
        .rule-item input {
            width: 100px;
            padding: 5px;
            border: 1px solid #d9d9d9;
            border-radius: 4px;
        }
        
        .result-section {
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        
        .result-section h2 {
            font-size: 18px;
            margin-bottom: 15px;
            color: #1890ff;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
        }
        
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #e8e8e8;
        }
        
        th {
            background-color: #fafafa;
            font-weight: bold;
            color: #666;
        }
        
        tr:hover {
            background-color: #f5f5f5;
        }
        
        .export-section {
            text-align: center;
        }
        
        .btn {
            display: inline-block;
            padding: 10px 20px;
            background-color: #1890ff;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .btn:hover {
            background-color: #40a9ff;
        }
        
        .btn:disabled {
            background-color: #d9d9d9;
            cursor: not-allowed;
        }
        
        .error-message {
            color: #ff4d4f;
            margin-top: 10px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>员工考勤统计工具</h1>
            <p>导入Excel考勤表，自动计算考勤情况并生成统计报表</p>
        </header>
        
        <div class="upload-section">
            <div class="upload-area" id="uploadArea">
                <input type="file" id="fileInput" accept=".xlsx,.xls" multiple>
                <div class="upload-text">
                    <p>点击或拖拽Excel文件到此处上传</p>
                    <p style="font-size: 12px; color: #999; margin-top: 5px;">支持 .xlsx 和 .xls 格式，可同时上传多个文件</p>
                </div>
            </div>
            <div id="errorMessage" class="error-message"></div>
        </div>
        
        <div class="rules-section">
            <h2>考勤规则设置</h2>
            <div class="rule-item">
                <label>上班时间：</label>
                <input type="time" id="workStartTime" value="09:00">
            </div>
            <div class="rule-item">
                <label>下班时间：</label>
                <input type="time" id="workEndTime" value="18:00">
            </div>
            <div class="rule-item">
                <label>迟到1-30分钟扣款：</label>
                <input type="number" id="lateFine1" value="50" min="0">
                <span style="margin-left: 5px;">元</span>
            </div>
            <div class="rule-item">
                <label>迟到30分钟以上扣款：</label>
                <input type="number" id="lateFine2" value="100" min="0">
                <span style="margin-left: 5px;">元</span>
            </div>
            <div class="rule-item">
                <label>早退扣款：</label>
                <input type="number" id="earlyLeaveFine" value="50" min="0">
                <span style="margin-left: 5px;">元</span>
            </div>
            <div class="rule-item">
                <label>旷工扣款：</label>
                <input type="number" id="absentFine" value="200" min="0">
                <span style="margin-left: 5px;">元</span>
            </div>
            <div class="rule-item">
                <label>全勤奖：</label>
                <input type="number" id="perfectAttendanceBonus" value="200" min="0">
                <span style="margin-left: 5px;">元</span>
            </div>
        </div>
        
        <div class="result-section">
            <h2>统计结果</h2>
            <table id="resultTable">
                <thead>
                    <tr>
                        <th>员工姓名</th>
                        <th>月份</th>
                        <th>迟到次数</th>
                        <th>迟到扣款</th>
                        <th>早退次数</th>
                        <th>早退扣款</th>
                        <th>旷工次数</th>
                        <th>旷工扣款</th>
                        <th>全勤奖</th>
                        <th>总扣款</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- 统计结果将在这里动态生成 -->
                </tbody>
            </table>
        </div>
        
        <div class="export-section">
            <button id="exportBtn" class="btn" disabled>导出Excel报表</button>
        </div>
    </div>
    
    <!-- 引入SheetJS库 -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const fileInput = document.getElementById('fileInput');
            const uploadArea = document.getElementById('uploadArea');
            const errorMessage = document.getElementById('errorMessage');
            const resultTable = document.getElementById('resultTable').querySelector('tbody');
            const exportBtn = document.getElementById('exportBtn');
            
            // 考勤规则
            const rules = {
                workStartTime: document.getElementById('workStartTime'),
                workEndTime: document.getElementById('workEndTime'),
                lateFine1: document.getElementById('lateFine1'),
                lateFine2: document.getElementById('lateFine2'),
                earlyLeaveFine: document.getElementById('earlyLeaveFine'),
                absentFine: document.getElementById('absentFine'),
                perfectAttendanceBonus: document.getElementById('perfectAttendanceBonus')
            };
            
            // 点击上传区域触发文件选择
            uploadArea.addEventListener('click', function() {
                fileInput.click();
            });
            
            // 拖拽上传
            uploadArea.addEventListener('dragover', function(e) {
                e.preventDefault();
                uploadArea.style.borderColor = '#1890ff';
                uploadArea.style.backgroundColor = '#f0f7ff';
            });
            
            uploadArea.addEventListener('dragleave', function() {
                uploadArea.style.borderColor = '#d9d9d9';
                uploadArea.style.backgroundColor = 'white';
            });
            
            uploadArea.addEventListener('drop', function(e) {
                e.preventDefault();
                uploadArea.style.borderColor = '#d9d9d9';
                uploadArea.style.backgroundColor = 'white';
                
                if (e.dataTransfer.files.length > 0) {
                    processMultipleFiles(e.dataTransfer.files);
                }
            });
            
            // 文件选择变化
            fileInput.addEventListener('change', function(e) {
                if (e.target.files.length > 0) {
                    processMultipleFiles(e.target.files);
                }
            });
            
            // 处理多个文件
            function processMultipleFiles(files) {
                showError('');
                const allData = [];
                let processedFiles = 0;
                const totalFiles = files.length;
                
                if (totalFiles === 0) return;
                
                // 验证所有文件都是Excel格式
                for (const file of files) {
                    if (!file.name.endsWith('.xlsx') && !file.name.endsWith('.xls')) {
                        showError('请上传Excel格式的文件（.xlsx或.xls）');
                        return;
                    }
                }
                
                // 处理每个文件
                for (const file of files) {
                    const reader = new FileReader();
                    
                    reader.onload = function(e) {
                        try {
                            const data = new Uint8Array(e.target.result);
                            const workbook = XLSX.read(data, { type: 'array' });
                            const firstSheetName = workbook.SheetNames[0];
                            const worksheet = workbook.Sheets[firstSheetName];
                            const jsonData = XLSX.utils.sheet_to_json(worksheet);
                            
                            if (jsonData.length > 0) {
                                allData.push(...jsonData);
                            }
                        } catch (error) {
                            showError('解析Excel文件失败：' + error.message);
                        } finally {
                            processedFiles++;
                            if (processedFiles === totalFiles) {
                                if (allData.length === 0) {
                                    showError('所有Excel文件为空，请检查文件内容');
                                    return;
                                }
                                analyzeData(allData);
                            }
                        }
                    };
                    
                    reader.onerror = function() {
                        showError('读取文件失败，请重试');
                        processedFiles++;
                    };
                    
                    reader.readAsArrayBuffer(file);
                }
            }
            
            // 处理单个文件（保留用于兼容）
            function processFile(file) {
                processMultipleFiles([file]);
            }
            
            // 分析数据
            function analyzeData(data) {
                // 尝试识别列
                const headers = Object.keys(data[0]);
                let nameColumn = null;
                let dateColumn = null;
                let timeColumn = null;
                
                // 简单的列识别逻辑
                for (const header of headers) {
                    const lowerHeader = header.toLowerCase();
                    if (!nameColumn && (lowerHeader.includes('姓名') || lowerHeader.includes('name'))) {
                        nameColumn = header;
                    } else if (!dateColumn && (lowerHeader.includes('日期') || lowerHeader.includes('date'))) {
                        dateColumn = header;
                    } else if (!timeColumn && (lowerHeader.includes('时间') || lowerHeader.includes('time') || lowerHeader.includes('打卡'))) {
                        timeColumn = header;
                    }
                }
                
                if (!nameColumn || !dateColumn || !timeColumn) {
                    showError('无法识别考勤表中的姓名、日期或打卡时间列，请确保Excel表格包含这些信息');
                    return;
                }
                
                // 按员工和月份分组
                const employeeData = {};
                
                data.forEach(row => {
                    const name = row[nameColumn];
                    const date = row[dateColumn];
                    const time = row[timeColumn];
                    
                    if (!name || !date) return;
                    
                    const month = getMonthFromDate(date);
                    
                    if (!employeeData[name]) {
                        employeeData[name] = {};
                    }
                    
                    if (!employeeData[name][month]) {
                        employeeData[name][month] = {};
                    }
                    
                    if (!employeeData[name][month][date]) {
                        employeeData[name][month][date] = [];
                    }
                    
                    if (time) {
                        employeeData[name][month][date].push(time);
                    }
                });
                
                calculateAttendance(employeeData);
            }
            
            // 计算考勤
            function calculateAttendance(employeeData) {
                const workStartTime = rules.workStartTime.value;
                const workEndTime = rules.workEndTime.value;
                const lateFine1 = parseFloat(rules.lateFine1.value) || 0;
                const lateFine2 = parseFloat(rules.lateFine2.value) || 0;
                const earlyLeaveFine = parseFloat(rules.earlyLeaveFine.value) || 0;
                const absentFine = parseFloat(rules.absentFine.value) || 0;
                const perfectAttendanceBonus = parseFloat(rules.perfectAttendanceBonus.value) || 0;
                
                const results = [];
                
                for (const [name, months] of Object.entries(employeeData)) {
                    for (const [month, dates] of Object.entries(months)) {
                        let lateCount = 0;
                        let lateAmount = 0;
                        let earlyLeaveCount = 0;
                        let earlyLeaveAmount = 0;
                        let absentCount = 0;
                        let absentAmount = 0;
                        
                        for (const [date, times] of Object.entries(dates)) {
                            if (times.length === 0) {
                                // 旷工
                                absentCount++;
                                absentAmount += absentFine;
                            } else {
                                // 排序时间
                                times.sort();
                                const firstTime = times[0];
                                const lastTime = times[times.length - 1];
                                
                                // 检查迟到
                                if (firstTime > workStartTime) {
                                    lateCount++;
                                    // 计算迟到时间差
                                    const lateMinutes = getMinutesDifference(workStartTime, firstTime);
                                    if (lateMinutes <= 30) {
                                        lateAmount += lateFine1;
                                    } else {
                                        lateAmount += lateFine2;
                                    }
                                }
                                
                                // 检查早退
                                if (lastTime < workEndTime) {
                                    earlyLeaveCount++;
                                    earlyLeaveAmount += earlyLeaveFine;
                                }
                            }
                        }
                        
                        // 计算全勤奖
                        let bonus = 0;
                        if (lateCount === 0 && earlyLeaveCount === 0 && absentCount === 0) {
                            bonus = perfectAttendanceBonus;
                        }
                        
                        const totalFine = lateAmount + earlyLeaveAmount + absentAmount - bonus;
                        
                        results.push({
                            name,
                            month,
                            lateCount,
                            lateAmount,
                            earlyLeaveCount,
                            earlyLeaveAmount,
                            absentCount,
                            absentAmount,
                            bonus,
                            totalFine
                        });
                    }
                }
                
                displayResults(results);
            }
            
            // 计算时间差（分钟）
            function getMinutesDifference(start, end) {
                const [startHour, startMinute] = start.split(':').map(Number);
                const [endHour, endMinute] = end.split(':').map(Number);
                return (endHour - startHour) * 60 + (endMinute - startMinute);
            }
            
            // 从日期中提取月份（格式：YYYY-MM）
            function getMonthFromDate(date) {
                if (typeof date === 'string') {
                    // 处理不同格式的日期字符串
                    if (date.includes('-')) {
                        // YYYY-MM-DD 格式
                        return date.substring(0, 7);
                    } else if (date.includes('/')) {
                        // MM/DD/YYYY 格式
                        const parts = date.split('/');
                        if (parts.length >= 3) {
                            return `${parts[2]}-${parts[0].padStart(2, '0')}`;
                        }
                    }
                } else if (date instanceof Date) {
                    // 处理Date对象
                    const year = date.getFullYear();
                    const month = (date.getMonth() + 1).toString().padStart(2, '0');
                    return `${year}-${month}`;
                }
                return 'Unknown';
            }
            
            // 显示结果
            function displayResults(results) {
                resultTable.innerHTML = '';
                
                results.forEach(employee => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${employee.name}</td>
                        <td>${employee.month}</td>
                        <td>${employee.lateCount}</td>
                        <td>${employee.lateAmount}</td>
                        <td>${employee.earlyLeaveCount}</td>
                        <td>${employee.earlyLeaveAmount}</td>
                        <td>${employee.absentCount}</td>
                        <td>${employee.absentAmount}</td>
                        <td>${employee.bonus}</td>
                        <td>${employee.totalFine}</td>
                    `;
                    resultTable.appendChild(row);
                });
                
                // 启用导出按钮
                exportBtn.disabled = false;
                
                // 保存结果用于导出
                window.attendanceResults = results;
            }
            
            // 导出Excel
            exportBtn.addEventListener('click', function() {
                if (!window.attendanceResults || window.attendanceResults.length === 0) {
                    showError('没有数据可导出');
                    return;
                }
                
                const data = window.attendanceResults.map(employee => ({
                    '员工姓名': employee.name,
                    '月份': employee.month,
                    '迟到次数': employee.lateCount,
                    '迟到扣款': employee.lateAmount,
                    '早退次数': employee.earlyLeaveCount,
                    '早退扣款': employee.earlyLeaveAmount,
                    '旷工次数': employee.absentCount,
                    '旷工扣款': employee.absentAmount,
                    '全勤奖': employee.bonus,
                    '总扣款': employee.totalFine
                }));
                
                const worksheet = XLSX.utils.json_to_sheet(data);
                const workbook = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(workbook, worksheet, '考勤统计');
                
                // 导出文件
                XLSX.writeFile(workbook, '员工考勤统计报表.xlsx');
            });
            
            // 显示错误信息
            function showError(message) {
                errorMessage.textContent = message;
            }
        });
    </script>
</body>
</html>
